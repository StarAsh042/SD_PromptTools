name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (syntax-level rules)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Byte-compile all modules
        run: python -m compileall -q .

      - name: Import smoke test
        run: |
          python -c "import config, logging_config, prompt_converter, image_processor, metadata_extractor, gradio_interface"
