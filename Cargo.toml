[package]
name = "sdprompt-core"
version = "2.0.0"
edition = "2021"
description = "SD Prompt Tools 的核心运算（括号解析、权重计算、转义与清理）"

[lib]
name = "sdprompt_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }

[profile.release]
lto = true
codegen-units = 1
